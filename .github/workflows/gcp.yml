name: Build and Push Frontend Image to GCR 
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: gcr.io/onus-sandbox/react-demo

jobs:
  build-push-gcr:
    name: Build and Push to GCR
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    
    - id: 'auth'
      uses: 'google-github-actions/auth@v0'
      with:
        credentials_json: '${{ secrets.SANDBOX_SA }}'

    - name: 'Set up Cloud SDK'
      uses: google-github-actions/setup-gcloud@v0
    
    - name: 'Use gcloud CLI'
      run: 'gcloud info'

    - name: Configure Docker Client
      run: |-
        gcloud auth configure-docker --quiet

    - uses: actions/setup-node@v2
      with:
        node-version: '16'
        cache: 'yarn' # or yarn
    
    - name: Setup yarn
      run: yarn install
    
    - name: Build source
      run: yarn build

    - name: Get Hash
      id: hash
      run: echo "git_hash=$(git rev-parve --short "$GITHUB_SHA")" >> $GITHUB_HASH
    
    - name: Check Hash
      run: echo "${{ env.hash }}"

    - name: Build docker image
      run: docker build . -t $IMAGE_NAME:latest

    - name: Push Image to Container Registry (GCR)
      run: |-
        docker tag $IMAGE_NAME:latest $IMAGE_NAME:$env.hash