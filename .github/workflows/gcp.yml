name: Build and Push Frontend Image to GCR 
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: frontend-demo

jobs:
  build-push-gcr:
    name: Build and Push to GCR
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - uses: actions/setup-node@v2
      with:
        node-version: '16'
        cache: 'yarn' # or yarn
    
    - name: Setup yarn
      run: yarn
    
    - name: Build source
      run: yarn build

    - name: Build docker image
      run: docker build . -t $IMAGE_NAME:latest